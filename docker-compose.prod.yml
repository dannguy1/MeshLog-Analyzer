# prplOS LCM Log Analysis System - Production Docker Compose Override
# This file extends the base docker-compose.yml with production-specific settings

version: '3.8'

services:
  # Backend API - Production Configuration
  backend:
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - DATA_DIR=/data/WNC/LCM-Logs-Data
      - DATABASE_URL=sqlite:///./data/prplos_analysis.db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - MAX_FILE_SIZE_MB=100
      - ENABLE_METRICS=true
    volumes:
      - ./data:/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./analysis_results:/app/analysis_results
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Frontend - Production Configuration
  frontend:
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Redis - Production Configuration
  redis:
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Celery Worker - Production Configuration
  celery_worker:
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - DATA_DIR=/data/WNC/LCM-Logs-Data
      - DATABASE_URL=sqlite:///./data/prplos_analysis.db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./data:/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./analysis_results:/app/analysis_results
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Celery Beat - Production Configuration
  celery_beat:
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - DATA_DIR=/data/WNC/LCM-Logs-Data
      - DATABASE_URL=sqlite:///./data/prplos_analysis.db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./data:/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./analysis_results:/app/analysis_results
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

# Production volumes with specific drivers
volumes:
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/redis
  uploads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./uploads
  analysis_results:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./analysis_results
  sqlite_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data

