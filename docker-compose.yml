services:
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: prplos_redis
    command: redis-server --appendonly yes
    volumes:
      - /data/WNC/LCM-Logs-Data/redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - prplos_network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: prplos_backend
    environment:
      - DATABASE_URL=sqlite:///./data/prplos_analysis.db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DATA_DIR=/app/data
      - WNC_LOG_AGENTS_ENABLED=true
      - WNC_LOG_AGENTS_URL=http://172.17.0.1:8001
      - WNC_LOG_AGENTS_TIMEOUT=300
      - SHARED_DATA_PATH=/app/data
      # Integrated Agent Configuration
      - INTEGRATED_AGENTS_ENABLED=true
      - INTEGRATED_AGENTS_PATH=app.agents
      - AGENT_DISCOVERY_AUTO_REFRESH=true
      - AGENT_DISCOVERY_REFRESH_INTERVAL=300
    volumes:
      - /data/WNC/LCM-Logs-Data/uploads:/app/uploads
      - /data/WNC/LCM-Logs-Data/analysis_results:/app/analysis_results
      - /data/WNC/LCM-Logs-Data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - prplos_network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: prplos_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - prplos_network
    restart: unless-stopped

  # Celery Worker (for background tasks)
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: prplos_celery_worker
    command: celery -A app.core.celery worker --loglevel=info
    environment:
      - DATABASE_URL=sqlite:///./data/prplos_analysis.db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ENVIRONMENT=production
      - DATA_DIR=/app/data
      - WNC_LOG_AGENTS_ENABLED=true
      - WNC_LOG_AGENTS_URL=http://172.17.0.1:8001
      - WNC_LOG_AGENTS_TIMEOUT=300
      - SHARED_DATA_PATH=/app/data
    volumes:
      - /data/WNC/LCM-Logs-Data/uploads:/app/uploads
      - /data/WNC/LCM-Logs-Data/analysis_results:/app/analysis_results
      - /data/WNC/LCM-Logs-Data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - prplos_network
    restart: unless-stopped

  # Celery Beat (for scheduled tasks)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: prplos_celery_beat
    command: celery -A app.core.celery beat --loglevel=info
    environment:
      - DATABASE_URL=sqlite:///./data/prplos_analysis.db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ENVIRONMENT=production
      - DATA_DIR=/app/data
      - WNC_LOG_AGENTS_ENABLED=true
      - WNC_LOG_AGENTS_URL=http://172.17.0.1:8001
      - WNC_LOG_AGENTS_TIMEOUT=300
      - SHARED_DATA_PATH=/app/data
    volumes:
      - /data/WNC/LCM-Logs-Data/uploads:/app/uploads
      - /data/WNC/LCM-Logs-Data/analysis_results:/app/analysis_results
      - /data/WNC/LCM-Logs-Data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - prplos_network
    restart: unless-stopped

# volumes:
#   redis_data:
#     driver: local
#   uploads:
#     driver: local
#   analysis_results:
#     driver: local
#   sqlite_data:
#     driver: local

networks:
  prplos_network:
    driver: bridge
